name: Compilar EXE final
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar portable
        run: dotnet publish Impresora.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Subir EXE final
        uses: actions/upload-artifact@v4
        with:
          name: Impresora-Portable
          path: bin/Release/net8.0-windows/win-x64/publish/Impresora.exe
